<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>骨骼档案校准</title>
  <link rel="icon" href="data:," />
  <style>
    body { margin: 0; padding: 16px; background: #f1f1ee; color: #222; font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .hint { color: #666; margin-bottom: 12px; }
    .hint code { background: #e4e4df; padding: 0 4px; border-radius: 3px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 8px; }
    .cell { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
    .cell canvas { display: block; width: 200px; height: 260px; }
    .cell .cap { padding: 4px 6px 6px; border-top: 1px solid #eee; }
    .cell .cap b { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .cell .cap span { color: #666; }
    .cell.ref { border-color: #34c759; }
    .cell.missing { opacity: .45; }
    .cell.missing .cap span::after { content: '  · 缺失'; color: #d33; }
    #err { color: #d33; font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="title">骨骼档案校准</h1>
  <div class="hint">
    每格：该关节 <b>+30°</b>，其余为 0（站立）；灰色残影 = 站立参考。方向反了 → 在档案 <code>joints</code> 里改 <code>sign</code> 或 <code>axis</code>。
    切换档案：<code>?profile=xbot | bodykun_male | bodychan_female</code>
  </div>
  <div id="err"></div>
  <div id="grid"></div>
  <script type="module" src="/src/calib.js"></script>
</body>
</html>
