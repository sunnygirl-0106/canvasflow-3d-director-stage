<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 导演台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d12'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%2334c759'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/timeline.css" />
</head>
<body>
  <div id="app">
    <main>
      <nav id="sideRail" aria-label="场景工具"></nav>
      <!-- 左：场景清单 -->
      <aside class="side left">
        <header>
          <button class="ic" id="closeBtn" title="关闭">×</button>
          <div class="logo">3D导演台</div><div id="sceneActions"></div>
          <button class="ic" id="foldLeft" title="折叠场景列表">‹</button>
        </header>
        <h3>场景</h3>
        <div class="searchbox">
          <input id="search" placeholder="请输入搜索内容" />
          <span class="si" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
        </div>
        <div id="outliner"></div>
      </aside>

      <!-- 中：视口 -->
      <div id="viewport">
        <div class="viewtabs" id="viewtabs">
          <button data-v="director" class="on" title="导演视角：自由旋转、移动视角，编辑场景">导演视角</button>
          <button data-v="camera" title="机位视角：查看当前摄像机的构图">机位视角</button>
        </div>
        <button id="foldRight" class="panel-fold" title="折叠属性面板">›</button>
        <div id="frame"></div>
        <div id="labelLayer"></div>
        <div class="pov-hint" id="povHint" hidden>未设主机位 · 播放时使用当前机位</div>
        <div id="navg" role="button" tabindex="0" title="重置视角">
          <svg width="74" height="74" viewBox="0 0 74 74" id="navsvg"></svg>
          <div class="lab">重置视角</div>
        </div>
        <div id="stageTools"><div id="dock"></div></div>
      </div>

      <!-- 右：未选中=场景面板 / 选中=属性·姿势 -->
      <aside class="side right" id="rightPanel">
        <div id="scenePanel"></div>
        <div id="inspector" hidden></div>
      </aside>
    </main>

    <!-- 底：时间轴（可折叠到只剩播放条） -->
    <section id="timeline"></section>
  </div>
  <div id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
